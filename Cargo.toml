[workspace]
resolver = "2"
members  = ["esp-vocat", "examples"]

[workspace.package]
edition      = "2024"
rust-version = "1.95"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/Hahihula/esp-vocat-rust-examples"

# One version of each dependency for the library and the demos.
[workspace.dependencies]
esp-vocat = { path = "esp-vocat" }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32s3", "log-04", "unstable", "wifi"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
# The console is the USB-Serial-JTAG on the USB-C port. UART0 TX (GPIO43)
# drives the green LED on this board, so never print to the UART.
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32s3",
  "jtag-serial",
  "log-04",
] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "log", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
embedded-io-async = "0.7.0"
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = "0.11"
sntpc-time-embassy = "0.6"
# MP3 decoder (no_std, allocation-free port of minimp3). Without the default
# `wide` SIMD feature, which targets x86/ARM.
nanomp3-core = { version = "0.2.0", default-features = false }
log = "0.4.27"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-embedded-hal = "0.6"
embedded-hal-async = "1.0"
libm = "0.2"
embedded-graphics = "0.8"
# Async drivers for the BMI270 (with Bosch's config blob, BSD-3-Clause) and ES8311.
oxstack-drivers = { version = "0.2.1", default-features = false, features = ["bmi270", "es8311"] }
critical-section = "1.2.0"
static_cell = "2.1.1"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
# Not "s": at that level the Xtensa LLVM backend fails on the MP3 decoder of
# demo 09 ("Cannot select: i32 = Constant<4608>").
opt-level     = 2
